<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8fe0cf"/><stop offset="1" stop-color="#1f5a3a"/></linearGradient>
    <radialGradient id="brilho" cx=".5" cy=".42" r=".5"><stop offset="0" stop-color="#ffffff" stop-opacity=".75"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></radialGradient>
    <linearGradient id="pele" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffd9b8"/><stop offset="1" stop-color="#d9955f"/></linearGradient>
    <linearGradient id="peleD" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd9b8"/><stop offset="1" stop-color="#d28d57"/></linearGradient>
    <linearGradient id="capa" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3f7a57"/><stop offset="1" stop-color="#17402a"/></linearGradient>
    <linearGradient id="lombada" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0f2f1e"/><stop offset="1" stop-color="#2c6a47"/></linearGradient>
    <linearGradient id="paginas" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffaf0"/><stop offset="1" stop-color="#e3d6b8"/></linearGradient>
    <linearGradient id="paginasD" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffaf0"/><stop offset="1" stop-color="#e3d6b8"/></linearGradient>
    <linearGradient id="vinco" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8a7a52" stop-opacity="0"/><stop offset=".5" stop-color="#8a7a52" stop-opacity=".45"/><stop offset="1" stop-color="#8a7a52" stop-opacity="0"/></linearGradient>
    <linearGradient id="ouro" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff0a8"/><stop offset="1" stop-color="#d9a21b"/></linearGradient>
    <radialGradient id="maca" cx=".35" cy=".3" r=".85"><stop offset="0" stop-color="#ff9a90"/><stop offset=".55" stop-color="#e0342e"/><stop offset="1" stop-color="#a51616"/></radialGradient>
    <radialGradient id="folha" cx=".3" cy=".3" r=".9"><stop offset="0" stop-color="#b6ee9a"/><stop offset="1" stop-color="#2e8b4f"/></radialGradient>
    <filter id="sombra" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#0b2417" flood-opacity=".45"/></filter>
  </defs>
  <rect width="512" height="512" fill="url(#fundo)"/>
  <circle cx="256" cy="210" r="210" fill="url(#brilho)"/>

  <!-- Bíblia aberta: uma página de cada lado -->
  <g filter="url(#sombra)">
    <path d="M116 318a14 14 0 0 1 14-14h252a14 14 0 0 1 14 14v124a14 14 0 0 1-14 14H130a14 14 0 0 1-14-14z" fill="url(#capa)"/>
    <path d="M256 318C222 304 172 304 132 316V442C172 430 222 430 256 446Z" fill="url(#paginas)"/>
    <path d="M256 318C290 304 340 304 380 316V442C340 430 290 430 256 446Z" fill="url(#paginasD)"/>
    <path d="M132 442C172 430 222 430 256 446C290 430 340 430 380 442" fill="none" stroke="#c9b98f" stroke-width="4"/>
    <rect x="236" y="316" width="40" height="130" fill="url(#vinco)"/>
    <path d="M256 318V446" stroke="#8a7a52" stroke-opacity=".7" stroke-width="3"/>
    <g fill="none" stroke="#7d6f4a" stroke-opacity=".35" stroke-width="3" stroke-linecap="round">
      <path d="M150 340C180 333 210 333 232 340M150 358C180 351 210 351 232 358M150 376C180 369 210 369 232 376M150 394C180 387 210 387 232 394M150 412C180 405 210 405 232 412"/>
      <path d="M280 340C302 333 332 333 362 340M280 358C302 351 332 351 362 358M280 376C302 369 332 369 362 376M280 394C302 387 332 387 362 394M280 412C302 405 332 405 362 412"/>
    </g>
    <path d="M262 440v32l9-8 9 8v-35z" fill="#d9a21b" stroke="#8a5f0b" stroke-width="2"/>
  </g>

  <!-- Mãos em oração (vista de três quartos, inclinadas) -->
  <g filter="url(#sombra)" transform="translate(8 -26) rotate(-22 256 330)">
    <!-- polegar da mão de trás -->
    <rect x="292" y="150" width="22" height="70" rx="11" transform="rotate(10 303 185)" fill="url(#peleD)" stroke="#9a5b2d" stroke-opacity=".5" stroke-width="2.5"/>
    <rect x="297" y="154" width="11" height="18" rx="5.5" transform="rotate(10 303 185)" fill="#ffe9d4" stroke="#b97a4a" stroke-opacity=".5" stroke-width="2"/>
    <!-- costas da mão de trás -->
    <path d="M258 340C304 340 336 306 332 252C330 222 318 196 296 176L264 120L252 200Z" fill="url(#peleD)" stroke="#9a5b2d" stroke-opacity=".5" stroke-width="2.5" stroke-linejoin="round"/>
    <g fill="none" stroke="#a8683a" stroke-opacity=".5" stroke-width="3" stroke-linecap="round">
      <path d="M288 196C300 230 306 270 300 312"/><path d="M272 206C282 240 286 276 282 316"/><path d="M306 214C316 240 318 270 312 300"/>
    </g>
    <!-- mão da frente: dedos -->
    <g fill="url(#pele)" stroke="#9a5b2d" stroke-opacity=".55" stroke-width="2.5">
      <rect x="210" y="184" width="21" height="128" rx="10.5" transform="rotate(-2 220 246)"/>
      <rect x="224" y="152" width="22" height="160" rx="11"/>
      <rect x="238" y="128" width="22" height="184" rx="11"/>
      <rect x="252" y="114" width="22" height="196" rx="11" transform="rotate(1.5 263 210)"/>
      <rect x="208" y="254" width="78" height="84" rx="22"/>
    </g>
    <!-- unhas -->
    <g fill="#ffe9d4" stroke="#b97a4a" stroke-opacity=".5" stroke-width="2">
      <rect x="214" y="188" width="12" height="20" rx="6"/><rect x="229" y="156" width="13" height="22" rx="6.5"/>
      <rect x="243" y="132" width="13" height="22" rx="6.5"/><rect x="257" y="118" width="13" height="22" rx="6.5" transform="rotate(1.5 263 129)"/>
    </g>
    <!-- dobras dos dedos -->
    <g fill="none" stroke="#a8683a" stroke-opacity=".5" stroke-width="2.5" stroke-linecap="round">
      <path d="M214 238h12M229 220h13M243 202h13M257 190h13"/><path d="M212 270h12M231 262h13M249 256h13"/>
    </g>
    <!-- polegar da frente, pela lateral -->
    <path d="M204 268c-12-8-22 2-20 18l8 42c2 10 12 12 22 8l10-4v-52c-6-8-14-12-20-12z" fill="url(#pele)" stroke="#9a5b2d" stroke-opacity=".55" stroke-width="2.5"/>
    <!-- manga -->
    <path d="M222 338C256 332 300 326 338 336L352 396C312 392 276 380 246 360C232 352 224 346 222 338Z" fill="#ffffff" stroke="#c9d8d2" stroke-width="3"/>
    <path d="M248 348C276 358 308 366 340 376M262 338C288 342 316 346 336 352" fill="none" stroke="#b9cbc4" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Fruta -->
  <g filter="url(#sombra)">
    <path d="M118 354c-30-22-70-4-66 44 4 44 30 66 56 60 10-3 16-3 26 0 28 6 54-18 56-60 2-48-38-66-72-44z" fill="url(#maca)"/>
    <path d="M122 356c0-16 4-30 12-42" fill="none" stroke="#6d3a1d" stroke-width="8" stroke-linecap="round"/>
    <path d="M134 326c12-22 42-24 52-12-8 22-34 28-52 12z" fill="url(#folha)"/>
    <ellipse cx="86" cy="392" rx="9" ry="20" fill="#ffffff" fill-opacity=".5" transform="rotate(14 86 392)"/>
  </g>
</svg>
